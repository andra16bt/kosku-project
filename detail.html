<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Detail Kos – KosKu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="css/cari.css" />
    <link rel="stylesheet" href="css/detail.css" />
    <link rel="stylesheet" href="css/transitions.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-inner">
        <div class="left">
          <a class="brand" href="index.html">Kos<span>Ku</span></a>
          <nav class="nav">
            <a href="index.html">Beranda</a
            ><a class="on" href="cari.html">Cari Kos</a
            ><a href="favorit.html"
              >Favorit <span class="badge" id="favCount">0</span></a
            >
          </nav>
        </div>
        <form class="hsearch" action="cari.html">
          <span class="material-symbols-outlined">search</span>
          <input
            name="q"
            placeholder="Cari lokasi, kampus, atau nama kos"
            aria-label="Cari kos"
          />
        </form>
        <div class="city">
          <span class="material-symbols-outlined">location_on</span>Surabaya
        </div>
      </div>
    </header>

    <main>
      <div class="wrap" id="app">
        <p class="muted" style="padding: 24px 0">Memuat…</p>
      </div>
    </main>

    <dialog
      id="dlg"
      style="
        border: 0;
        border-radius: 14px;
        padding: 16px;
        width: 92%;
        max-width: 760px;
        max-height: 88vh;
        overflow: auto;
      "
    >
      <button
        id="dlgClose"
        class="iconbtn"
        style="float: right"
        aria-label="Tutup"
      >
        <span class="material-symbols-outlined">close</span>
      </button>
      <div
        id="dlgImgs"
        style="
          clear: both;
          display: flex;
          flex-direction: column;
          gap: 10px;
          margin-top: 10px;
        "
      ></div>
    </dialog>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/util.js"></script>
    <script src="js/detail.js"></script>
    <script src="js/transitions.js"></script>
  </body>
</html>
